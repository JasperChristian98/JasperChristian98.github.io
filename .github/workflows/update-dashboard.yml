name: Update FPL Draft Dashboard

on:
  # Run once a day at 04:00 UTC (05:00 UK during BST).
  # This gives Monday-night gameweeks time to finish processing.
  schedule:
    - cron: '0 */4 * * 2-4'
    - cron: '0 * * * 5,6,0,1'

  # Allow you to run it manually from the Actions tab.
  workflow_dispatch:

  # Also update the dashboard whenever the scraper/workflow files change.
  push:
    branches:
      - main
    paths:
      - 'Draft.py'
      - 'requirements.txt'
      - '.github/workflows/update-dashboard.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run FPL scraper and dashboard generator
        run: python Draft.py

      - name: Show generated files
        run: |
          echo 'Generated dashboard:'
          ls -lh index.html
          echo 'History file:'
          ls -lh fpl_draft_history.json || true

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add index.html fpl_draft_history.json

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update FPL Draft dashboard'
            git push
          fi
