name: Update McDraft dashboard

on:
  schedule:
    # Cron is UTC. Every 10 minutes Friday-Monday, 20 minutes Tuesday-Thursday.
    - cron: '*/10 * * * 5,6,0,1'
    - cron: '*/20 * * * 2,3,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mcdraft/**'
      - 'run.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'draft_player_mapping.csv'
      - '.github/workflows/update-dashboard.yml'

permissions:
  contents: write

concurrency:
  group: mcdraft-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check module boundaries and retained features
        run: python -m unittest discover -s tests -v
      - name: Build dashboard
        run: python run.py
      - name: Verify generated output
        shell: bash
        run: |
          test -s index.html
          grep -qi '</html>' index.html
          test -s fpl_draft_history.json
      - name: Commit generated dashboard and history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html fpl_draft_history.json draft_player_mapping_audit.csv
          if test -f mcdraft_prediction_history.json; then git add mcdraft_prediction_history.json; fi
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Update McDraft dashboard [skip ci]'
            # Prevent data loss from scheduled jobs racing a manual push.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
